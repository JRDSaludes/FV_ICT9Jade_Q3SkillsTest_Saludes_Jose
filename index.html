<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q3 Skills Test</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-image: url('https://t3.ftcdn.net/jpg/04/29/97/24/360_F_429972422_idgQSEcP8Ur9ky1ZXXUlrGwx39wUjyqH.jpg');
    background-repeat: no-repeat;
    background-size: cover;
}

.translucent {
    background-color: rgba(0,0,0,0.65);
    border-radius: 12px;
    padding: 30px;
}
</style>
</head>

<body class="p-4">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Registration</a>
    <form class="d-flex">
      <input class="form-control me-2" type="text" placeholder="Search">
      <button class="btn btn-primary" type="button">Search</button>
    </form>
  </div>
</nav>

<!-- MAIN -->
<div class="container translucent text-white" style="max-width:650px;">

<h1 class="text-center mb-3">Create Account</h1>

<p>Please fill out the registration form. All fields are required before submitting.</p>

<p>Reference: 
<a href="https://www.w3schools.com" target="_blank" class="text-info">w3schools.com</a>
</p>

<hr>

<!-- FORM -->
<label>First Name</label>
<input type="text" id="fname" class="form-control mb-3">

<label>Last Name</label>
<input type="text" id="lname" class="form-control mb-3">

<label>Age</label>
<input type="number" id="age" class="form-control mb-3">

<label>Email</label>
<input type="email" id="email" class="form-control mb-3">

<label>Username</label>
<input type="text" id="user" class="form-control mb-3">

<label>Password</label>
<input type="password" id="pass" class="form-control mb-3">

<div class="form-check mb-3">
  <input class="form-check-input" type="checkbox" id="agree">
  <label class="form-check-label">
    I accept the Terms of Use and Privacy Policy
  </label>
</div>

<button class="btn btn-info w-100 mb-2" onclick="register()">Create my account</button>
<button class="btn btn-secondary w-100" onclick="clearForm()">Cancel</button>

<p id="output" class="mt-3 fw-bold"></p>

</div>

<script>

// page load message
alert("To register, click OK");

// ---------- REGISTER FUNCTION ----------
function register() {

    // get values from inputs
    var fn = document.getElementById("fname").value;
    var ln = document.getElementById("lname").value;
    var age = Number(document.getElementById("age").value);
    var em = document.getElementById("email").value;
    var us = document.getElementById("user").value;
    var pw = document.getElementById("pass").value;
    var agree = document.getElementById("agree").checked;

    // simple validation using if operators
    if (fn == "" || ln == "" || age == 0 || em == "" || us == "" || pw == "") {
        alert("Please complete all fields");
        return;
    }

    if (agree == false) {
        alert("You must accept the terms");
        return;
    }

    // output message
    document.getElementById("output").innerHTML =
        "Registered: " + fn + " " + ln + " (Age " + age + ")";

    alert("Your profile has been uploaded");
}


// ---------- CLEAR FUNCTION ----------
function clearForm() {

    // reset fields
    document.getElementById("fname").value = "";
    document.getElementById("lname").value = "";
    document.getElementById("age").value = "";
    document.getElementById("email").value = "";
    document.getElementById("user").value = "";
    document.getElementById("pass").value = "";
    document.getElementById("agree").checked = false;

    document.getElementById("output").innerHTML = "";

    alert("Form cleared");
}

</script>

</body>
</html>
